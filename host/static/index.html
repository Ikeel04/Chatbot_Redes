<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FinAssist - Chatbot MCP</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>FinAssist</h1>
            <p>Asistente de finanzas personales (Proyecto 1 - Redes)</p>
        </header>

        <main id="chat-window">
            <!-- Los mensajes se insertan aqui via JS -->
        </main>

        <form id="chat-form">
            <input id="chat-input" type="text" placeholder="Escribe tu mensaje..." autocomplete="off" />
            <button type="submit">Enviar</button>
        </form>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
